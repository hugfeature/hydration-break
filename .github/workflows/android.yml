name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build, unit tests and lint
        run: gradle --no-daemon assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest
      - name: Verify APK signature and metadata
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk
          mkdir -p app/build/distribution
          cp app/build/outputs/apk/debug/app-debug.apk app/build/distribution/hydration-break-0.1.3.apk
          cd app/build/distribution
          sha256sum hydration-break-0.1.3.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: hydration-break-0.1.3-debug-apk
          path: app/build/distribution/*
          if-no-files-found: error
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and test on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb root
            adb wait-for-device
            adb shell settings put global auto_time 0
            adb shell date 100812002026.00
            bash scripts/validate-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            device-evidence/
